services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: anne_nail_studio
      MYSQL_USER: anne_nail_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env y configura DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copia .env.example a .env y configura MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./backend/migrations/002_admin.sql:/docker-entrypoint-initdb.d/002-admin.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: anne_nail_app
      DB_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env y configura DB_PASSWORD}
      DB_NAME: anne_nail_studio
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/google/service-account.json}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_SECRET:-}
      TIMEZONE: ${TIMEZONE:-America/Mexico_City}
      BUSINESS_OPEN_HOUR: ${BUSINESS_OPEN_HOUR:-10}
      BUSINESS_CLOSE_HOUR: ${BUSINESS_CLOSE_HOUR:-19}
      BUSINESS_CLOSE_MINUTE: ${BUSINESS_CLOSE_MINUTE:-30}
      BUSINESS_DAYS: ${BUSINESS_DAYS:-1,2,3,4,5,6}
      SLOT_INTERVAL_MINUTES: ${SLOT_INTERVAL_MINUTES:-30}
    ports:
      - "3000:3000"
    volumes:
      - ${GOOGLE_CREDENTIALS_DIR:-./backend/.credentials}:/run/secrets/google:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql-data:
